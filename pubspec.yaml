name: planner
description: "Личный планер — клон Todoist для Windows 10 и Android, синхронизация без сервера."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Ядро синхронизации — наш собственный пакет в монорепозитории.
  oplog_sync:
    path: packages/oplog_sync

  # Состояние и навигация
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.1

  # База данных (SQLite). sqlite3 ^3 сам несёт нативную библиотеку —
  # sqlite3_flutter_libs больше не нужен (помечен EOL на pub.dev).
  drift: ^2.35.2
  drift_flutter: ^0.3.1

  # Модели и сериализация
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Домен
  rrule: ^0.2.18
  intl: ^0.20.3
  clock: ^1.1.3

  # Инфраструктура
  logger: ^2.8.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

  # Платформа: уведомления, Android-виджеты, окно/трей/хоткей Windows
  flutter_local_notifications: ^22.3.2
  home_widget: ^0.10.0
  window_manager: ^0.5.2
  tray_manager: ^0.8.0
  hotkey_manager: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Кодогенерация
  build_runner: ^2.16.2 # 2.17 пока несовместим с riverpod_generator 4.0.9
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

  # Линтеры. riverpod_lint подключается в analysis_options.yaml (новая система
  # плагинов анализатора Dart), в pubspec он не нужен.
  flutter_lints: ^6.0.0

  # Тесты
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
