# CI: те же проверки, что в чек-листе «Готово» (CONTRIBUTING.md), но на сервере GitHub при каждом push и PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Если в ветку пришёл новый push, предыдущий незавершённый прогон отменяется.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Анализ, формат и тесты на Linux: самый быстрый и дешёвый раннер.
  check:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # tray_manager → nativeapi → cnativeapi: пакет с build-хуком, который компилирует
      # C-код при `flutter test` и на Linux требует заголовки GTK 3, X11 и Xi.
      - name: Системные библиотеки для нативных плагинов (GTK 3, X11, Xi)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libx11-dev libxi-dev

      # Версия Flutter закреплена и совпадает с локальной (C:\src\flutter): со
      # «последним stable» CI менял анализатор сам — 3.47.8 вышел 23.10 и дал
      # предупреждение, которого локально не было. Обновлять вместе с локальной.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Версии
        run: flutter --version

      - name: Зависимости приложения
        run: flutter pub get

      # Анализ из корня захватывает и packages/oplog_sync, поэтому его зависимости
      # должны быть разрешены до flutter analyze, а не только перед его тестами.
      - name: Зависимости пакета oplog_sync
        working-directory: packages/oplog_sync
        run: dart pub get

      - name: Кодогенерация (drift, freezed, riverpod, json)
        run: dart run build_runner build -d

      - name: Формат (dart format --set-exit-if-changed)
        run: dart format --output=none --set-exit-if-changed .

      - name: Анализ (0 warnings)
        run: flutter analyze

      - name: Тесты приложения
        run: flutter test

      - name: Тесты ядра синхронизации (packages/oplog_sync)
        working-directory: packages/oplog_sync
        run: dart test

  # Сборка Windows: проверяет, что десктопная часть собирается. Долго, поэтому только на push в main.
  build-windows:
    name: build windows
    if: github.event_name == 'push'
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter build windows --release
